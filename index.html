<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- 修正1：拡大できるように maximum-scale / user-scalable を削除 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>お買い物サポート (Shopping Assist)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes staffAlertFlash {
      0%, 100% { background-color: #0f172a; }
      25%, 75% { background-color: #84cc16; }
      50%      { background-color: #facc15; }
    }
    .alert-flashing { animation: staffAlertFlash 1.2s ease-in-out infinite; }

    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(132, 204, 22, 0.85); }
      50%      { box-shadow: 0 0 0 16px rgba(132, 204, 22, 0); }
    }
    .mic-listening {
      animation: micPulse 1.4s infinite;
      background-color: #84cc16 !important;
      color: #0f172a !important;
    }

    .btn-tactile:active { transform: scale(0.98); }

    /* 点滅が苦手な人向け：端末の「視差効果を減らす」がONなら点滅しない */
    @media (prefers-reduced-motion: reduce) {
      .alert-flashing { animation: none; background-color: #84cc16; }
      .mic-listening { animation: none; }
    }
  </style>
</head>
<body class="flex flex-col min-h-screen bg-[#0f172a] text-white overflow-x-hidden">

  <!-- 上部タブ -->
  <header class="w-full bg-[#090d16] border-b-4 border-[#facc15] px-3 py-3 sm:px-6 sm:py-4 shrink-0 z-20">
    <nav aria-label="メインメニュー" class="max-w-5xl mx-auto grid grid-cols-3 gap-2 sm:gap-4" role="tablist">
      <button id="tab-btn-1" role="tab" aria-selected="true" aria-controls="panel-1" onclick="switchTab(1)" class="tab-btn">1. 店員呼び出し</button>
      <button id="tab-btn-2" role="tab" aria-selected="false" aria-controls="panel-2" onclick="switchTab(2)" class="tab-btn">2. 希望を伝える</button>
      <button id="tab-btn-3" role="tab" aria-selected="false" aria-controls="panel-3" onclick="switchTab(3)" class="tab-btn">3. 徒歩ナビ</button>
    </nav>
  </header>

  <!-- VoiceOver / TalkBack 用のお知らせ領域 -->
  <div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- 画面上のお知らせ（見える人向け。読み上げは sr-live で行うので aria-hidden） -->
  <div id="toast-banner" aria-hidden="true" class="hidden fixed top-24 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-2xl px-6 py-4 rounded-2xl bg-[#facc15] text-black text-xl sm:text-2xl font-black border-4 border-white shadow-2xl text-center">
    <span id="toast-text"></span>
  </div>

  <main id="main-container" class="flex-1 flex flex-col justify-between w-full max-w-5xl mx-auto px-4 pt-6 pb-4 sm:px-8 sm:pt-8 sm:pb-6">

    <!-- ============ タブ1：店員呼び出し ============ -->
    <section id="panel-1" role="tabpanel" aria-labelledby="tab-btn-1" class="flex-1 flex flex-col items-center justify-center text-center rounded-3xl p-4 sm:p-8">

      <div id="call-standby-view" class="w-full max-w-3xl mx-auto space-y-6 sm:space-y-8">
        <h1 class="text-3xl sm:text-5xl font-black text-[#facc15] leading-snug">店員さんをお願いします</h1>

        <!-- 修正：お願いしたい内容を選べるようにした -->
        <div class="w-full p-5 rounded-3xl bg-slate-900 border-4 border-slate-600 space-y-3 text-left">
          <h2 id="scene-heading" class="text-xl sm:text-2xl font-black text-[#facc15]">お願いしたいこと</h2>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3" role="radiogroup" aria-labelledby="scene-heading">
            <button type="button" role="radio" aria-checked="false" data-scene="search" onclick="selectScene('search')" class="scene-option btn-tactile min-h-[62px] rounded-2xl text-xl sm:text-2xl font-black border-4">商品探し</button>
            <button type="button" role="radio" aria-checked="false" data-scene="register" onclick="selectScene('register')" class="scene-option btn-tactile min-h-[62px] rounded-2xl text-xl sm:text-2xl font-black border-4">レジ</button>
            <button type="button" role="radio" aria-checked="false" data-scene="general" onclick="selectScene('general')" class="scene-option btn-tactile min-h-[62px] rounded-2xl text-xl sm:text-2xl font-black border-4">お手伝い全般</button>
          </div>
        </div>

        <p class="text-lg sm:text-2xl font-bold text-white leading-relaxed">
          ボタンを押すと、チャイム音と画面点滅で周囲の店員さんにお知らせします
        </p>

        <button type="button" onclick="startStaffCall()" class="btn-tactile w-full sm:w-auto inline-flex items-center justify-center gap-4 px-8 py-6 sm:px-14 sm:py-8 rounded-3xl bg-[#84cc16] hover:bg-[#a3e635] text-black text-2xl sm:text-4xl font-black border-4 border-white shadow-2xl">
          <span aria-hidden="true">🔔</span>
          <span>店員さんを呼ぶ</span>
        </button>
      </div>

      <div id="call-active-view" class="hidden w-full max-w-3xl mx-auto space-y-6">
        <div class="p-6 sm:p-10 rounded-3xl bg-white text-black border-8 border-[#facc15] shadow-2xl space-y-4">
          <div class="inline-block px-5 py-2 rounded-xl bg-black text-[#84cc16] text-xl sm:text-2xl font-black">
            <span aria-hidden="true">🔔</span> 呼び出し中
          </div>
          <h2 class="text-3xl sm:text-5xl font-black leading-tight">店員さんをお願いします</h2>
          <p id="call-message" class="text-xl sm:text-3xl font-bold text-slate-900 leading-relaxed"></p>
        </div>

        <button type="button" onclick="stopStaffCall()" class="btn-tactile w-full sm:w-auto inline-flex items-center justify-center gap-3 px-10 py-6 sm:px-16 sm:py-7 rounded-3xl bg-red-600 hover:bg-red-500 text-white text-2xl sm:text-4xl font-black border-4 border-white shadow-2xl">
          <span aria-hidden="true">⏹</span>
          <span>呼び出しを停止する</span>
        </button>
      </div>
    </section>

    <!-- ============ タブ2：希望を伝える ============ -->
    <section id="panel-2" role="tabpanel" aria-labelledby="tab-btn-2" class="hidden flex-1 flex flex-col justify-between space-y-5">

      <button id="escort-toggle-card" type="button" role="switch" aria-checked="true" onclick="toggleEscortRequest()" class="btn-tactile w-full p-5 sm:p-6 rounded-3xl border-4 text-left flex items-center justify-between gap-4 shadow-xl">
        <span class="space-y-1 block">
          <span class="block text-2xl sm:text-4xl font-black leading-snug">
            <span aria-hidden="true">⭐️</span> 付き添っていただけると幸いです。
          </span>
          <span id="escort-status-label" class="block text-lg sm:text-xl font-black"></span>
        </span>
        <span id="escort-badge" aria-hidden="true" class="shrink-0 px-4 py-2 rounded-2xl text-xl sm:text-2xl font-black"></span>
      </button>

      <div class="w-full p-5 sm:p-6 rounded-3xl bg-slate-900/95 border-4 border-slate-600 space-y-3 text-left">
        <h2 id="bag-heading" class="text-xl sm:text-2xl font-black text-[#facc15]">レジ袋の枚数</h2>
        <!-- 修正3：role="radio" と aria-checked で選択中が読み上げられる -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" role="radiogroup" aria-labelledby="bag-heading">
          <button type="button" role="radio" aria-checked="false" data-bag="0枚" onclick="selectBag('0枚')" class="bag-option btn-tactile min-h-[62px] rounded-2xl text-xl sm:text-2xl font-black border-4">0枚</button>
          <button type="button" role="radio" aria-checked="false" data-bag="1枚" onclick="selectBag('1枚')" class="bag-option btn-tactile min-h-[62px] rounded-2xl text-xl sm:text-2xl font-black border-4">1枚</button>
          <button type="button" role="radio" aria-checked="false" data-bag="2枚" onclick="selectBag('2枚')" class="bag-option btn-tactile min-h-[62px] rounded-2xl text-xl sm:text-2xl font-black border-4">2枚</button>
          <button type="button" role="radio" aria-checked="false" data-bag="3枚" onclick="selectBag('3枚')" class="bag-option btn-tactile min-h-[62px] rounded-2xl text-xl sm:text-2xl font-black border-4">3枚</button>
        </div>
      </div>

      <div class="w-full p-5 sm:p-6 rounded-3xl bg-slate-900/95 border-4 border-slate-600 space-y-3 text-left">
        <h2 id="pay-heading" class="text-xl sm:text-2xl font-black text-[#facc15]">お支払い方法</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" role="radiogroup" aria-labelledby="pay-heading">
          <button type="button" role="radio" aria-checked="false" data-pay="現金" onclick="selectPayment('現金')" class="pay-option btn-tactile min-h-[62px] rounded-2xl text-xl sm:text-2xl font-black border-4">現金</button>
          <button type="button" role="radio" aria-checked="false" data-pay="クレジットカード" onclick="selectPayment('クレジットカード')" class="pay-option btn-tactile min-h-[62px] rounded-2xl text-xl sm:text-2xl font-black border-4">クレジットカード</button>
          <button type="button" role="radio" aria-checked="false" data-pay="電子マネー" onclick="selectPayment('電子マネー')" class="pay-option btn-tactile min-h-[62px] rounded-2xl text-xl sm:text-2xl font-black border-4">電子マネー</button>
          <button type="button" role="radio" aria-checked="false" data-pay="バーコード決済" onclick="selectPayment('バーコード決済')" class="pay-option btn-tactile min-h-[62px] rounded-2xl text-xl sm:text-2xl font-black border-4">バーコード決済</button>
        </div>
      </div>

      <div class="w-full p-5 sm:p-6 rounded-3xl bg-slate-900 border-4 border-[#84cc16] space-y-4 text-left shadow-xl">
        <div id="preference-summary-text" class="text-lg sm:text-2xl font-bold text-white leading-relaxed"></div>
        <button type="button" onclick="speakPreferences()" class="btn-tactile w-full min-h-[72px] py-4 px-6 rounded-2xl bg-[#84cc16] hover:bg-[#a3e635] text-black text-2xl sm:text-3xl font-black border-4 border-white shadow-lg flex items-center justify-center gap-3">
          <span aria-hidden="true">🔊</span>
          <span>店員さんに音声で伝える</span>
        </button>
      </div>
    </section>

    <!-- ============ タブ3：徒歩ナビ ============ -->
    <section id="panel-3" role="tabpanel" aria-labelledby="tab-btn-3" class="hidden flex-1 flex flex-col justify-between space-y-5">

      <div id="favorite-launch-card" class="hidden w-full p-5 sm:p-6 rounded-3xl bg-[#84cc16] text-black border-4 border-white shadow-2xl space-y-3 text-left">
        <div class="flex items-center justify-between gap-2">
          <span class="px-3 py-1 rounded-xl bg-black text-[#facc15] text-base sm:text-lg font-black">登録済みのよく行く場所</span>
          <span id="favorite-address-badge" class="text-base sm:text-xl font-black truncate max-w-[65%]"></span>
        </div>
        <button id="favorite-launch-btn" type="button" onclick="launchFavoritePlaceNav()" class="btn-tactile w-full min-h-[76px] p-4 rounded-2xl bg-black hover:bg-slate-900 text-[#facc15] text-2xl sm:text-3xl font-black border-4 border-white shadow-lg flex items-center justify-center gap-3 text-center leading-snug">
          <span aria-hidden="true">🚶</span>
          <span id="favorite-launch-label">よく行く場所へ徒歩ナビ</span>
        </button>
      </div>

      <div class="w-full p-5 sm:p-6 rounded-3xl bg-slate-900 border-4 border-[#facc15] space-y-4 text-left">
        <h2 class="text-xl sm:text-3xl font-black text-[#facc15]">
          <span aria-hidden="true">⭐</span> よく行く場所の登録
        </h2>
        <p class="text-base sm:text-xl font-bold text-slate-200">
          よく使うスーパーや病院を登録しておくと、ボタン1回や「いつものスーパー」と話すだけで案内できます。
        </p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="space-y-1">
            <label for="fav-name-input" class="block text-base sm:text-lg font-black text-white">呼び名（例：いつものスーパー）</label>
            <input id="fav-name-input" type="text" placeholder="例：いつものスーパー" class="w-full min-h-[58px] px-4 py-2 rounded-2xl bg-black text-white text-lg sm:text-xl font-bold border-4 border-slate-500 focus:border-[#84cc16] focus:outline-none" />
          </div>
          <div class="space-y-1">
            <label for="fav-place-input" class="block text-base sm:text-lg font-black text-white">店舗名・住所（例：マルナカ 志度店）</label>
            <input id="fav-place-input" type="text" placeholder="例：マルナカ 志度店" class="w-full min-h-[58px] px-4 py-2 rounded-2xl bg-black text-white text-lg sm:text-xl font-bold border-4 border-slate-500 focus:border-[#84cc16] focus:outline-none" />
          </div>
        </div>
        <button type="button" onclick="saveFavoritePlace()" class="btn-tactile w-full min-h-[64px] py-3 px-6 rounded-2xl bg-[#facc15] hover:bg-yellow-300 text-black text-xl sm:text-2xl font-black border-4 border-white shadow-lg flex items-center justify-center gap-2">
          <span aria-hidden="true">💾</span>
          <span>よく行く場所を保存</span>
        </button>
      </div>

      <div class="w-full p-5 sm:p-6 rounded-3xl bg-slate-900 border-4 border-slate-600 space-y-4 text-left">
        <h2 class="text-xl sm:text-2xl font-black text-[#84cc16]">
          <span aria-hidden="true">🗺️</span> 目的地を指定して徒歩ナビ・周辺検索
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
          <button type="button" onclick="startNavigationToQuery('近くのスーパー')" class="btn-tactile min-h-[62px] px-3 py-2 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white text-lg sm:text-xl font-black border-4 border-[#84cc16]">
            <span aria-hidden="true">🏪</span> 近くのスーパー
          </button>
          <button type="button" onclick="startNavigationToQuery('近くのコンビニ')" class="btn-tactile min-h-[62px] px-3 py-2 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white text-lg sm:text-xl font-black border-4 border-[#84cc16]">
            <span aria-hidden="true">🏬</span> 近くのコンビニ
          </button>
          <button type="button" onclick="startNavigationToQuery('近くの薬局')" class="btn-tactile min-h-[62px] px-3 py-2 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white text-lg sm:text-xl font-black border-4 border-[#84cc16]">
            <span aria-hidden="true">💊</span> 近くの薬局
          </button>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
          <label for="destination-input" class="sr-only">目的地</label>
          <input id="destination-input" type="text" placeholder="例：マルナカ 志度店 / 近くのスーパー" class="flex-1 min-h-[62px] px-4 py-3 rounded-2xl bg-black text-white text-xl sm:text-2xl font-bold border-4 border-slate-500 focus:border-[#84cc16] focus:outline-none" />
          <button type="button" onclick="startNavigationFromInput()" class="btn-tactile min-h-[62px] px-6 py-3 rounded-2xl bg-[#84cc16] hover:bg-[#a3e635] text-black text-xl sm:text-2xl font-black border-4 border-white shrink-0">
            <span aria-hidden="true">🚶</span> 徒歩ナビ開始
          </button>
        </div>

        <p id="nav-mode-indicator" class="text-sm sm:text-base font-bold text-slate-300"></p>
        <p class="text-sm sm:text-base font-bold text-slate-400">
          ※ 地図の案内は補助です。白杖や同行援護と一緒にお使いください。
        </p>
      </div>
    </section>
  </main>

  <!-- 下部：VoiceOver設定＋音声操作ボタン -->
  <footer class="w-full bg-[#090d16] border-t-4 border-[#facc15] px-4 py-3 sm:px-8 sm:py-4 shrink-0 z-20">
    <div class="max-w-5xl mx-auto space-y-3">
      <!-- 修正2：VoiceOver使用中はアプリ自身の読み上げを止めて二重読みを防ぐ -->
      <button id="sr-mode-btn" type="button" role="switch" aria-checked="false" onclick="toggleScreenReaderMode()" class="btn-tactile w-full min-h-[52px] px-4 py-2 rounded-2xl bg-slate-800 text-white text-lg sm:text-xl font-black border-4 border-slate-500">
        VoiceOver・TalkBackを使っている：OFF
      </button>
      <button id="voice-control-btn" type="button" onclick="toggleVoiceRecognition()" class="btn-tactile w-full min-h-[72px] sm:min-h-[82px] px-6 py-4 rounded-2xl bg-[#facc15] hover:bg-yellow-300 text-black text-2xl sm:text-4xl font-black border-4 border-white shadow-2xl flex items-center justify-center gap-3">
        <span id="voice-btn-icon" aria-hidden="true">🎤</span>
        <span id="voice-btn-text">音声で操作する</span>
      </button>
    </div>
  </footer>

  <script>
    // ---------- 保存キー ----------
    const KEYS = {
      ESCORT: 'sa_pref_escort_v3',
      BAGS: 'sa_pref_bags_v3',
      PAY: 'sa_pref_payment_v3',
      SCENE: 'sa_pref_scene_v3',
      SR_MODE: 'sa_pref_srmode_v3',
      FAV_NAME: 'sa_fav_place_name_v3',
      FAV_QUERY: 'sa_fav_place_query_v3',
      LAST_DEST: 'sa_last_dest_v3'
    };

    // ---------- 状態 ----------
    const state = {
      activeTab: 1,
      isCalling: false,
      chimePaused: false,
      escort: true,
      bags: '0枚',
      payment: '現金',
      scene: 'search',
      srMode: false,
      favName: '',
      favQuery: '',
      destination: '近くのスーパー'
    };

    const SCENE_MESSAGES = {
      search: '目が不自由なため、商品探しのお手伝いをお願いいたします。',
      register: '目が不自由なため、レジでのお手伝いをお願いいたします。',
      general: '目が不自由なため、お手伝いをお願いいたします。'
    };
    const SCENE_NAMES = { search: '商品探し', register: 'レジ', general: 'お手伝い全般' };

    let chimeLoopTimer = null;
    let toastTimer = null;

    // ---------- localStorage（エラーでも止まらないように） ----------
    function saveItem(key, value) {
      try { localStorage.setItem(key, value); } catch (e) { console.warn('保存エラー:', e); }
    }
    function loadItem(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }

    // ---------- 初期化 ----------
    window.addEventListener('DOMContentLoaded', () => {
      loadPreferences();
      switchTab(1, false);
      updatePreferenceUI();
      updateSceneUI();
      updateScreenReaderModeUI();
      updateFavoriteUI();
      updateNavIndicator(state.destination);
    });

    function loadPreferences() {
      const savedEscort = loadItem(KEYS.ESCORT);
      if (savedEscort !== null) state.escort = (savedEscort === 'true');
      state.bags = loadItem(KEYS.BAGS) || state.bags;
      state.payment = loadItem(KEYS.PAY) || state.payment;
      state.scene = loadItem(KEYS.SCENE) || state.scene;
      state.srMode = loadItem(KEYS.SR_MODE) === 'true';
      state.favName = loadItem(KEYS.FAV_NAME) || '';
      state.favQuery = loadItem(KEYS.FAV_QUERY) || '';
      state.destination = loadItem(KEYS.LAST_DEST) || state.destination;

      document.getElementById('fav-name-input').value = state.favName;
      document.getElementById('fav-place-input').value = state.favQuery;

      const destInput = document.getElementById('destination-input');
      destInput.value = state.destination;
      destInput.addEventListener('input', (e) => {
        state.destination = e.target.value;
        saveItem(KEYS.LAST_DEST, state.destination);
        updateNavIndicator(state.destination);
      });
    }

    // ---------- 画面上のお知らせ ----------
    function showToast(message) {
      const banner = document.getElementById('toast-banner');
      document.getElementById('toast-text').textContent = message;
      banner.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => banner.classList.add('hidden'), 3500);
    }

    // ---------- 読み上げ ----------
    // srMode ON  → VoiceOver/TalkBack に読ませる（アプリは話さない）
    // srMode OFF → アプリが自分で話す
    // forceAudio → 店員さんに聞かせたい時は、どちらのモードでもスピーカーから話す
    function speakText(text, forceAudio = false) {
      if (state.srMode && !forceAudio) {
        announceToScreenReader(text);
        return;
      }
      speakAloud(text);
    }

    function announceToScreenReader(text) {
      const srLive = document.getElementById('sr-live');
      // 同じ文でも読み直してもらえるように、いったん空にしてから入れる
      srLive.textContent = '';
      setTimeout(() => { srLive.textContent = text; }, 100);
    }

    function speakAloud(text) {
      if (!('speechSynthesis' in window)) {
        announceToScreenReader(text);
        return;
      }
      try {
        window.speechSynthesis.cancel();
        // iPhoneでは cancel 直後の speak が無視されることがあるので少し待つ
        setTimeout(() => {
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'ja-JP';
          utter.rate = 0.96;
          utter.pitch = 1.0;
          utter.volume = 1.0;
          window.speechSynthesis.speak(utter);
        }, 60);
      } catch (e) {
        console.warn('読み上げエラー:', e);
      }
    }

    // ---------- VoiceOverモード ----------
    function toggleScreenReaderMode() {
      state.srMode = !state.srMode;
      saveItem(KEYS.SR_MODE, String(state.srMode));
      updateScreenReaderModeUI();
      speakText(state.srMode
        ? 'VoiceOverモードをオンにしました。アプリの読み上げを止めます。'
        : 'VoiceOverモードをオフにしました。アプリが読み上げます。');
    }

    function updateScreenReaderModeUI() {
      const btn = document.getElementById('sr-mode-btn');
      btn.setAttribute('aria-checked', String(state.srMode));
      btn.textContent = `VoiceOver・TalkBackを使っている：${state.srMode ? 'ON' : 'OFF'}`;
      btn.className = state.srMode
        ? 'btn-tactile w-full min-h-[52px] px-4 py-2 rounded-2xl bg-[#84cc16] text-black text-lg sm:text-xl font-black border-4 border-white'
        : 'btn-tactile w-full min-h-[52px] px-4 py-2 rounded-2xl bg-slate-800 text-white text-lg sm:text-xl font-black border-4 border-slate-500';
    }

    // ---------- タブ ----------
    const TAB_ON = 'tab-btn btn-tactile min-h-[60px] sm:min-h-[72px] px-2 py-2 rounded-2xl text-base sm:text-2xl font-black border-4 flex items-center justify-center text-center leading-tight bg-[#facc15] text-black border-white shadow-lg';
    const TAB_OFF = 'tab-btn btn-tactile min-h-[60px] sm:min-h-[72px] px-2 py-2 rounded-2xl text-base sm:text-2xl font-black border-4 flex items-center justify-center text-center leading-tight bg-slate-800 text-white border-slate-500';

    function switchTab(tabNumber, announce = true) {
      state.activeTab = tabNumber;
      for (let i = 1; i <= 3; i++) {
        const btn = document.getElementById(`tab-btn-${i}`);
        const panel = document.getElementById(`panel-${i}`);
        const on = (i === tabNumber);
        panel.classList.toggle('hidden', !on);
        btn.setAttribute('aria-selected', String(on));
        btn.className = on ? TAB_ON : TAB_OFF;
      }
      if (announce) {
        const messages = {
          1: '1番、店員呼び出し画面です。',
          2: '2番、希望を伝える画面です。',
          3: '3番、徒歩ナビ画面です。'
        };
        speakText(messages[tabNumber]);
      }
    }

    // ---------- 選択ボタンの共通処理（色＋aria-checked） ----------
    const OPT_ON = 'btn-tactile min-h-[62px] rounded-2xl text-xl sm:text-2xl font-black border-4 bg-[#facc15] text-black border-white';
    const OPT_OFF = 'btn-tactile min-h-[62px] rounded-2xl text-xl sm:text-2xl font-black border-4 bg-slate-800 text-white border-slate-500';

    function updateOptionGroup(selector, dataAttr, currentValue, extraClass) {
      document.querySelectorAll(selector).forEach((btn) => {
        const selected = btn.getAttribute(dataAttr) === currentValue;
        btn.setAttribute('aria-checked', String(selected));
        btn.className = `${extraClass} ${selected ? OPT_ON : OPT_OFF}`;
      });
    }

    // =========================================================
    // タブ1：店員呼び出し
    // =========================================================
    let audioCtx = null;

    function prepareAudio() {
      // 修正4：iPhoneのマナーモードでも音が出るようにする（対応端末のみ）
      try {
        if (navigator.audioSession) navigator.audioSession.type = 'playback';
      } catch (e) {}
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return false;
      if (!audioCtx) audioCtx = new AudioContextClass();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return true;
    }

    function playThreeChimeBurst() {
      try {
        if (!prepareAudio()) return;

        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-12, audioCtx.currentTime);
        compressor.ratio.setValueAtTime(6, audioCtx.currentTime);

        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(1.65, audioCtx.currentTime);
        compressor.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        for (let repeat = 0; repeat < 3; repeat++) {
          const base = now + repeat * 1.1;
          playChimeNote(compressor, 1046.5, base, 0.24);
          playChimeNote(compressor, 1318.5, base + 0.25, 0.24);
          playChimeNote(compressor, 1046.5, base + 0.50, 0.46);
        }
      } catch (e) {
        console.warn('チャイム再生エラー:', e);
      }
    }

    function playChimeNote(destinationNode, freq, startTime, duration) {
      const oscMain = audioCtx.createOscillator();
      const oscHarmonic = audioCtx.createOscillator();
      const noteGain = audioCtx.createGain();
      const harmGain = audioCtx.createGain();

      oscMain.type = 'triangle';
      oscMain.frequency.setValueAtTime(freq, startTime);
      oscHarmonic.type = 'sine';
      oscHarmonic.frequency.setValueAtTime(freq * 2, startTime);
      harmGain.gain.setValueAtTime(0.28, startTime);

      noteGain.gain.setValueAtTime(0.001, startTime);
      noteGain.gain.exponentialRampToValueAtTime(0.95, startTime + 0.02);
      noteGain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      oscMain.connect(noteGain);
      oscHarmonic.connect(harmGain);
      harmGain.connect(noteGain);
      noteGain.connect(destinationNode);

      oscMain.start(startTime);
      oscHarmonic.start(startTime);
      oscMain.stop(startTime + duration + 0.02);
      oscHarmonic.stop(startTime + duration + 0.02);
    }

    // 修正4：iPhoneは振動に対応していないので、対応端末だけ振動させる
    function triggerVibration(pattern = [300, 150, 300, 150, 450]) {
      if (typeof navigator.vibrate === 'function') {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    function selectScene(scene) {
      state.scene = scene;
      saveItem(KEYS.SCENE, scene);
      updateSceneUI();
      speakText(`お願いしたいこと、${SCENE_NAMES[scene]}に設定しました。`);
    }

    function updateSceneUI() {
      updateOptionGroup('.scene-option', 'data-scene', state.scene, 'scene-option');
      document.getElementById('call-message').textContent = SCENE_MESSAGES[state.scene];
    }

    function startStaffCall() {
      if (state.activeTab !== 1) switchTab(1, false);
      if (state.isCalling) return;

      state.isCalling = true;
      state.chimePaused = false;
      updateSceneUI();

      document.body.classList.add('alert-flashing');
      document.getElementById('call-standby-view').classList.add('hidden');
      document.getElementById('call-active-view').classList.remove('hidden');

      // 先に案内を話してからチャイムを鳴らす（声とチャイムが重ならないように）
      // 修正：停止ボタンの位置の案内を「画面の真ん中」に直した
      speakText('店員さんを呼び出します。止めるときは、画面の真ん中の停止ボタンを押すか、音声ボタンを押して、止める、と話してください。');

      prepareAudio();
      setTimeout(() => {
        if (!state.isCalling) return;
        playThreeChimeBurst();
        triggerVibration();
        if (chimeLoopTimer) clearInterval(chimeLoopTimer);
        chimeLoopTimer = setInterval(() => {
          if (!state.isCalling || state.chimePaused) return;
          playThreeChimeBurst();
          triggerVibration();
        }, 4200);
      }, 2500);
    }

    function stopStaffCall() {
      const wasCalling = state.isCalling;
      state.isCalling = false;
      state.chimePaused = false;

      if (chimeLoopTimer) {
        clearInterval(chimeLoopTimer);
        chimeLoopTimer = null;
      }
      // 鳴っている途中のチャイムも止める
      if (audioCtx) {
        audioCtx.close().catch(() => {});
        audioCtx = null;
      }
      triggerVibration(0);

      document.body.classList.remove('alert-flashing');
      document.getElementById('call-active-view').classList.add('hidden');
      document.getElementById('call-standby-view').classList.remove('hidden');

      if (wasCalling) speakText('呼び出しを停止しました。');
    }

    // =========================================================
    // タブ2：希望を伝える
    // =========================================================
    function toggleEscortRequest() {
      state.escort = !state.escort;
      saveItem(KEYS.ESCORT, String(state.escort));
      updatePreferenceUI();
      speakText(state.escort ? '付き添い希望をオンにしました。' : '付き添い希望をオフにしました。');
    }

    function selectBag(value) {
      state.bags = value;
      saveItem(KEYS.BAGS, value);
      updatePreferenceUI();
      speakText(`レジ袋、${value}に設定しました。`);
    }

    function selectPayment(value) {
      state.payment = value;
      saveItem(KEYS.PAY, value);
      updatePreferenceUI();
      speakText(`お支払い方法、${value}に設定しました。`);
    }

    function updatePreferenceUI() {
      const card = document.getElementById('escort-toggle-card');
      const status = document.getElementById('escort-status-label');
      const badge = document.getElementById('escort-badge');

      card.setAttribute('aria-checked', String(state.escort));
      if (state.escort) {
        card.className = 'btn-tactile w-full p-5 sm:p-6 rounded-3xl border-4 text-left flex items-center justify-between gap-4 shadow-xl bg-[#facc15] text-black border-white';
        status.textContent = '状態：ON（付き添いを希望する）';
        badge.className = 'shrink-0 px-4 py-2 rounded-2xl bg-black text-[#84cc16] text-xl sm:text-2xl font-black';
        badge.textContent = '希望する';
      } else {
        card.className = 'btn-tactile w-full p-5 sm:p-6 rounded-3xl border-4 text-left flex items-center justify-between gap-4 shadow-xl bg-slate-900 text-white border-slate-500';
        status.textContent = '状態：OFF（付き添い希望なし）';
        badge.className = 'shrink-0 px-4 py-2 rounded-2xl bg-slate-700 text-slate-200 text-xl sm:text-2xl font-black';
        badge.textContent = '希望しない';
      }

      updateOptionGroup('.bag-option', 'data-bag', state.bags, 'bag-option');
      updateOptionGroup('.pay-option', 'data-pay', state.payment, 'pay-option');

      document.getElementById('preference-summary-text').textContent =
        `付き添い希望：${state.escort ? 'あり' : 'なし'} ／ レジ袋：${state.bags} ／ お支払い：${state.payment}`;
    }

    function speakPreferences() {
      const escortSentence = state.escort ? '付き添っていただけると幸いです。' : '';
      const bagSentence = state.bags === '0枚' ? 'レジ袋は不要です。' : `レジ袋は、${state.bags}お願いします。`;
      const paySentence = `お支払い方法は、${state.payment}です。よろしくお願いいたします。`;
      // 店員さんに聞かせるので、VoiceOverモードでもスピーカーから話す
      speakText(`${escortSentence}${bagSentence}${paySentence}`, true);
    }

    // =========================================================
    // タブ3：徒歩ナビ
    // =========================================================
    function isMultiCandidateSearchQuery(query) {
      const normalized = query.trim().replace(/\s+/g, '');
      const genericKeywords = ['スーパー', 'コンビニ', '薬局', 'ドラッグストア', '駅', '銀行', '病院'];
      return genericKeywords.includes(normalized) || normalized.startsWith('近くの');
    }

    function buildGoogleMapsUrl(query, forcePinpoint = false) {
      const cleanQuery = (query || '近くのスーパー').trim();
      const encoded = encodeURIComponent(cleanQuery);
      if (!forcePinpoint && isMultiCandidateSearchQuery(cleanQuery)) {
        return `https://www.google.com/maps/search/?api=1&query=${encoded}`;
      }
      return `https://www.google.com/maps/dir/?api=1&destination=${encoded}&travelmode=walking`;
    }

    function updateNavIndicator(query, forcePinpoint = false) {
      const cleanQuery = (query || '').trim();
      const indicator = document.getElementById('nav-mode-indicator');
      if (!cleanQuery) {
        indicator.textContent = '';
        return;
      }
      const isPinpoint = forcePinpoint || !isMultiCandidateSearchQuery(cleanQuery);
      indicator.textContent = isPinpoint
        ? `モード：徒歩ルート案内（${cleanQuery}）`
        : `モード：周辺検索（${cleanQuery}）`;
    }

    // 修正5：アプリ起動の細工をやめて、普通のGoogleマップのURLを開くだけにした
    // （iPhone・Androidとも、Googleマップアプリが入っていれば自動でアプリが開く）
    function openGoogleMaps(query, forcePinpoint = false, customAnnounce = '') {
      const cleanQuery = (query || '近くのスーパー').trim();
      state.destination = cleanQuery;
      saveItem(KEYS.LAST_DEST, cleanQuery);
      document.getElementById('destination-input').value = cleanQuery;
      updateNavIndicator(cleanQuery, forcePinpoint);

      const isPinpoint = forcePinpoint || !isMultiCandidateSearchQuery(cleanQuery);
      const announceMsg = customAnnounce || (isPinpoint
        ? `${cleanQuery}まで、徒歩ナビを開きます。`
        : `${cleanQuery}を、Googleマップで探します。`);

      speakText(announceMsg);
      showToast(announceMsg);

      const url = buildGoogleMapsUrl(cleanQuery, forcePinpoint);
      // 案内を話し終わるまで少し待ってから開く
      setTimeout(() => { window.location.href = url; }, 1800);
    }

    function startNavigationToQuery(query) {
      openGoogleMaps(query, false);
    }

    function startNavigationFromInput() {
      const val = document.getElementById('destination-input').value.trim();
      if (!val) {
        speakText('目的地を入力するか、近くのスーパーボタンを押してください。');
        showToast('目的地を入力してください');
        return;
      }
      openGoogleMaps(val, false);
    }

    function saveFavoritePlace() {
      const placeVal = document.getElementById('fav-place-input').value.trim();
      const nameVal = document.getElementById('fav-name-input').value.trim() || 'いつものスーパー';

      if (!placeVal) {
        speakText('店舗名または住所を入力してから、保存ボタンを押してください。');
        showToast('店舗名・住所を入力してください');
        return;
      }

      state.favName = nameVal;
      state.favQuery = placeVal;
      saveItem(KEYS.FAV_NAME, nameVal);
      saveItem(KEYS.FAV_QUERY, placeVal);
      updateFavoriteUI();

      const msg = `よく行く場所、${nameVal}、${placeVal}を保存しました。`;
      speakText(msg);
      showToast(`✅ ${msg}`);
    }

    function updateFavoriteUI() {
      const card = document.getElementById('favorite-launch-card');
      if (state.favQuery) {
        card.classList.remove('hidden');
        document.getElementById('favorite-address-badge').textContent = state.favQuery;
        // innerHTML ではなく textContent を使う（安全のため）
        document.getElementById('favorite-launch-label').textContent =
          `${state.favName || 'よく行く場所'}へ徒歩ナビ`;
      } else {
        card.classList.add('hidden');
      }
    }

    function launchFavoritePlaceNav() {
      if (!state.favQuery) {
        switchTab(3, false);
        speakText('よく行く場所がまだ登録されていません。店舗名や住所を入力して保存してください。');
        showToast('よく行く場所がまだ登録されていません');
        return;
      }
      const labelName = state.favName || 'よく行く場所';
      openGoogleMaps(state.favQuery, true, `${labelName}、${state.favQuery}まで、徒歩ナビを開きます。`);
    }

    // =========================================================
    // 音声操作
    // =========================================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    function setVoiceButton(listening) {
      const btn = document.getElementById('voice-control-btn');
      btn.classList.toggle('mic-listening', listening);
      document.getElementById('voice-btn-icon').textContent = listening ? '🔴' : '🎤';
      document.getElementById('voice-btn-text').textContent = listening ? '聞き取り中… 話してください' : '音声で操作する';
    }

    // 修正：聞き取り中はチャイムを一時停止し、終わったら再開する
    function pauseChimeForListening() {
      if (!state.isCalling) return;
      state.chimePaused = true;
      if (audioCtx) audioCtx.suspend().catch(() => {});
    }
    function resumeChimeAfterListening() {
      if (!state.isCalling) return;
      state.chimePaused = false;
      if (audioCtx) audioCtx.resume().catch(() => {});
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        setVoiceButton(true);
      };
      recognition.onend = () => {
        isListening = false;
        setVoiceButton(false);
        resumeChimeAfterListening();
      };
      recognition.onerror = (event) => {
        isListening = false;
        if (event.error !== 'aborted' && event.error !== 'no-speech') {
          speakText('うまく聞き取れませんでした。もう一度ボタンを押してお話しください。');
        }
      };
      recognition.onresult = (event) => {
        processVoiceCommand(event.results[0][0].transcript.trim());
      };
    }

    function toggleVoiceRecognition() {
      if (!recognition) {
        speakText('このブラウザでは音声操作が使えません。画面のボタンで操作してください。');
        showToast('このブラウザは音声認識に未対応です');
        return;
      }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      try {
        if (isListening) {
          recognition.stop();
        } else {
          pauseChimeForListening();
          recognition.start();
        }
      } catch (e) {
        console.warn('音声認識起動エラー:', e);
        resumeChimeAfterListening();
      }
    }

    function processVoiceCommand(raw) {
      const cmd = raw.replace(/\s+/g, '');

      // 1. 呼び出し停止
      if (/止め|とめ|ストップ|解除|停止/.test(cmd)) {
        stopStaffCall();
        return;
      }

      // 2. 店員呼び出し（「商品を探して」「レジ」も場面として受け付ける）
      if (/店員|呼び出し|呼んで|助けて/.test(cmd)) {
        if (/探|さが/.test(cmd)) selectScene('search');
        else if (/レジ|会計/.test(cmd)) selectScene('register');
        startStaffCall();
        return;
      }

      // 3. レジ袋
      if (/袋/.test(cmd) || /^[0-3０-３零一二三ゼロ]枚/.test(cmd)) {
        if (/0枚|０枚|ゼロ|なし|不要|いらない/.test(cmd)) { switchTab(2, false); selectBag('0枚'); return; }
        if (/1枚|１枚|一枚/.test(cmd)) { switchTab(2, false); selectBag('1枚'); return; }
        if (/2枚|２枚|二枚/.test(cmd)) { switchTab(2, false); selectBag('2枚'); return; }
        if (/3枚|３枚|三枚/.test(cmd)) { switchTab(2, false); selectBag('3枚'); return; }
      }

      // 4. 支払い方法（修正：「ポイントカード」などで誤反応しないように）
      if (/現金/.test(cmd)) { switchTab(2, false); selectPayment('現金'); return; }
      if (/クレジット|クレカ|カード払い|カードで払/.test(cmd) && !/ポイントカード/.test(cmd)) {
        switchTab(2, false); selectPayment('クレジットカード'); return;
      }
      if (/電子マネー|交通系|ICカード|アイシー/.test(cmd)) { switchTab(2, false); selectPayment('電子マネー'); return; }
      if (/バーコード|QR|キューアール|ペイペイ|PayPay/i.test(cmd)) { switchTab(2, false); selectPayment('バーコード決済'); return; }

      // 5. 希望を伝える
      if (/希望|伝え|読み上げ/.test(cmd)) {
        switchTab(2, false);
        speakPreferences();
        return;
      }

      // 6. よく行く場所
      if (/いつものスーパー|いつものお店|いつもの店|よく行く場所|マイ目的地/.test(cmd)) {
        switchTab(3, false);
        launchFavoritePlaceNav();
        return;
      }

      // 7. 「〇〇までナビ」「〇〇へ案内して」
      const navMatch = cmd.match(/^(.+?)(?:まで|へ)?(?:徒歩)?(?:ナビ|案内|ルート|行き方|検索)(?:して|開始|お願い|を開始)?(?:ください)?$/);
      if (navMatch && navMatch[1]) {
        switchTab(3, false);
        openGoogleMaps(navMatch[1], false);
        return;
      }

      if (/近くのスーパー/.test(cmd)) { switchTab(3, false); openGoogleMaps('近くのスーパー'); return; }
      if (/近くのコンビニ/.test(cmd)) { switchTab(3, false); openGoogleMaps('近くのコンビニ'); return; }
      if (/近くの薬局|近くのドラッグストア/.test(cmd)) { switchTab(3, false); openGoogleMaps('近くの薬局'); return; }

      if (/ナビ|地図/.test(cmd)) {
        switchTab(3, false);
        if (state.favQuery) launchFavoritePlaceNav();
        else openGoogleMaps(state.destination || '近くのスーパー');
        return;
      }

      speakText(`「${raw}」と聞こえました。例えば、店員さんを呼んで、希望を伝えて、いつものスーパー、近くのスーパー、マルナカ志度店までナビ、のように話してください。`);
    }
  </script>
